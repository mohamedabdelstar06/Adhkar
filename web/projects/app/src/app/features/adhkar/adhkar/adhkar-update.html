<div class="modal-backdrop" (click)="state.closeUpdate()">
  <form class="modal-dialog" (click)="$event.stopPropagation()" (submit)="$event.preventDefault(); submit()">
    <div class="modal-header">
      <h3>{{ i18n.t('adhkar.edit') }}</h3>
      <button class="btn-close" type="button" (click)="state.closeUpdate()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <label class="field field-wide">
          <span>{{ i18n.t('adhkar.fieldText') }}</span>
          <textarea rows="3" dir="rtl" [formField]="adhkarForm.text"></textarea>
        </label>

        <label class="field field-wide">
          <span>{{ i18n.t('adhkar.fieldTranslation') }}</span>
          <input type="text" dir="ltr" [formField]="adhkarForm.translation" />
        </label>

        <label class="field">
          <span>{{ i18n.t('adhkar.fieldReference') }}</span>
          <input type="text" [formField]="adhkarForm.reference" />
        </label>

        <label class="field">
          <span>{{ i18n.t('adhkar.fieldCategory') }}</span>
          <select [formField]="adhkarForm.category">
            @for (category of categories; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </label>

        <label class="field">
          <span>{{ i18n.t('adhkar.fieldOrder') }}</span>
          <input type="number" [formField]="adhkarForm.displayOrder" />
        </label>

        <label class="field field-check">
          <input type="checkbox" [formField]="adhkarForm.isActive" />
          <span>{{ i18n.t('adhkar.fieldActive') }}</span>
        </label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-ghost" type="button" (click)="state.closeUpdate()">{{ i18n.t('adhkar.cancel') }}</button>
      <button class="btn-primary" type="submit" [disabled]="adhkarForm().invalid() || state.saving()">
        {{ i18n.t('adhkar.save') }}
      </button>
    </div>
  </form>
</div>
