<div class="modal-backdrop" (click)="state.closeUpdate()">
  <form class="modal-dialog" (click)="$event.stopPropagation()" (submit)="$event.preventDefault(); submit()">
    <div class="modal-header">
      <h3>{{ i18n.t('catalog.editProduct') }}</h3>
      <button class="btn-close" type="button" (click)="state.closeUpdate()">✕</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>{{ i18n.t('catalog.fieldSku') }}</label>
        <input type="text" class="form-control disabled-input" [value]="product().sku" disabled />
      </div>

      <div class="form-group">
        <label>{{ i18n.t('catalog.fieldName') }} *</label>
        <input type="text" class="form-control" [formField]="productForm.name" placeholder="e.g. Ultra Gaming Monitor" />
      </div>

      <div class="form-group">
        <label>{{ i18n.t('catalog.fieldDesc') }}</label>
        <textarea class="form-control" rows="2" [formField]="productForm.description"></textarea>
      </div>

      <div class="form-group">
        <label>{{ i18n.t('catalog.fieldPrice') }} *</label>
        <input type="number" step="0.01" class="form-control" [formField]="productForm.unitPrice" />
      </div>

      @if (state.errorMessage()) {
        <div class="alert-error">{{ state.errorMessage() }}</div>
      }
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" type="button" (click)="state.closeUpdate()">
        {{ i18n.t('catalog.cancel') }}
      </button>
      <button class="btn btn-primary" type="submit" [disabled]="productForm().invalid() || state.saving()">
        {{ i18n.t('catalog.save') }}
      </button>
    </div>
  </form>
</div>
