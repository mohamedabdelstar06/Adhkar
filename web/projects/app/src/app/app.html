<div class="app-shell" [attr.dir]="i18n.dir()">
  <header class="app-header">
    <div class="header-content">
      @if (isPlatformHost) {
      <div class="platform-brand">{{ i18n.t('platform.title') }}</div>
      } @else {
      <nav class="nav-tabs">
        <a class="nav-tab" routerLink="/adhkar" routerLinkActive="active">{{ i18n.t('nav.adhkar') }}</a>
        <a class="nav-tab" routerLink="/tenants" routerLinkActive="active">{{ i18n.t('nav.tenants') }}</a>
        <a class="nav-tab" routerLink="/catalog" routerLinkActive="active">{{ i18n.t('nav.catalog') }}</a>
        <a class="nav-tab" routerLink="/orders" routerLinkActive="active">{{ i18n.t('nav.orders') }}</a>
      </nav>
      }

      <div class="header-controls">
        <div class="lang-switch-group">
          <button class="btn-lang" type="button" [class.active]="i18n.lang() === 'ar'"
            (click)="i18n.use('ar')">
            عربي
          </button>
          <button class="btn-lang" type="button" [class.active]="i18n.lang() === 'en'"
            (click)="i18n.use('en')">
            EN
          </button>
        </div>
      </div>
    </div>
  </header>

  @if (isPlatformHost) {
  <zad-tenant-list />
  } @else {
  <zad-adhkar-toast />

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
  }

  <footer class="app-footer">
    <p>Mohamed Abdelstar - 2004</p>
  </footer>
</div>
